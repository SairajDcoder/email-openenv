spec_version: 1
name: email_env
description: "AI-powered email classification and action agent"
version: "1.0"
type: space
runtime: fastapi
app: server.app:app
port: 7860

observation:
  type: object

action:
  type: string

reward:
  type: float

tasks:
  - id: easy
    name: "Easy Classification"
    description: "Simple spam vs important classification"
    difficulty: easy
    grader: grader.grade

  - id: medium
    name: "Medium Logic"
    description: "Multi-category reasoning and filtering"
    difficulty: medium
    grader: grader.grade

  - id: hard
    name: "Hard Actioning"
    description: "Complete email automation and escalation"
    difficulty: hard
    grader: grader.grade