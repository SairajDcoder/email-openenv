[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-openenv"
version = "1.0.0"
description = "Email classification RL environment for Meta Hackathon"
authors = [
    { name = "SairajDcoder" }
]
dependencies = [
    "openai",
    "huggingface_hub",
    "pydantic",
    "openenv-core>=0.2.0",
    "fastapi",
    "uvicorn"
]

[project.scripts]
server = "server.app:main"
